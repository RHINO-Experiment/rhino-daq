# Observation Confiuration .yaml


observationParams:
  runLength: 3600
  preRunLength: 300
  obsCachePath: /media/usb0/rhino-data/obs_cache
  dataDirectory: /media/usb0/rhino-data/data
  preRunDirectory: /media/usb0/rhino-data/prerun
  optimisedObserving: false
  customName:

sdr:
  active: true
  centreFrequency: 72.0e+6
  bandwidth:  10.0e+6
  nChannels: 4069
  sdrDriver: sdrplay
  sdrLabel: SDRplay Dev0 RSPdx 2302031848
  sdrId: 2302031848
  sampleIntegrationTime: 1
  delay: 2
  sdrGain:
  sdrRFGR: 6
  sdrIFGR: 36
  sdrFlags: rfnotch_ctrl,iqcorr_ctrl
  partialSaveBlock: None
  spectrometerMode: pfb
  pfbParams:
    nTaps: 4
    appliedWindow: blackman
  fftParams:
    appliedWindow: Blackman

auxSdr:
  active: false
  centreFrequency: 70.0e+6
  bandwidth:  10.0e+6
  nChannels: 4096
  sdrDriver: sdrplay
  sdrLabel: SDRplay Dev1 RSP1A 2238063199
  sdrId: 2238063199
  sampleIntegrationTime: 3
  delay: 2
  sdrGain:
  sdrRFGR: 6
  sdrIFGR: 36
  partialSaveBlock:
  spectrometerMode: pfb
  pfbParams:
    nTaps: 4
    appliedWindow: blackman
  fftParams:
    appliedWindow: Blackman

arduino:
  active: true
  comPort: /dev/ttyACM0
  baudRate: 9600
  temperatureMonitoring:
    active: true
    obsRate: 1
    nProbes: 2
    temperatureControl:
      active: true
      upperLimit: 150
      lowerLimit: 135
      ambientLimit: 40
    
    probeLabels:
    - load_monitoring
    - ambient_monitoring
    unit: celcius
    cadence: 1
  
  switches:
    active: true
    optimisedObserving: false
    DickeSwitchCycleLength: 120
    switchSourceTargets:
    - antenna
    - antenna
    - antenna
    - antenna
    - open
    - short
    - long_open
    - long_short
    dickeSwitchCycle:
    - noise_diode
    - heated_load
    - load
    - source

  switchDictionary:
    noise_diode: t1t1e4
    load: t1t1e1
    short: t1t1e5
    open: t1t1e8
    long_open: t1t1e3
    long_short: t2t2e3
    heated_load: t1t1e6
    antenna: t1t1e7
    test_src: t1t1e2

vna:
  active: false
  completeSparams: true
  recalibrate: true
  switching: true #
  manualCalibration: false # true for manual calibration
  customName: false
  calibrationPath: vna_calibration/vna_calibration.txt # must be set either from exisiting or new
  integrations: 15
  dataPoints: 250 # must be less than 500
  switchInterval: 1
  frequencyRange: # Hz
    - 55.0e+6
    - 85.0e+6 
  switchTargets: # Path to VNA...
     - load
     - noisediode
     - longopen
  calibrationSwitchPaths: # Path from VNA to calibrators if using arduino to switch
    open: open
    short: short
    load: load
    through: empty
    
